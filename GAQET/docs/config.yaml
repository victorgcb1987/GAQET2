ID: "Arabidopsis thaliana"
Assembly: "/path/to/assembly.fasta"
Annotation: "/path/to/annotation.gff"
Basedir: "/path/to/outdir"
Analysis:
  - AGAT
  - BUSCO
  - PSAURON
  - DETENGA
  - OMARK
  - PROTHOMOLOGY
BUSCO_lineages:
  -  viridiplantae_odb10
  -  embryophyta_odb10
OMARK_taxid: ""
OMARK_db: ""
DETENGA_db: "rexdb-plant"
PROTHOMOLOGY_tags:
  - TREMBL: ""
  - SWISSPROT: ""
# Optional: intron length limits (bp), they depend on the lineage. They give two metrics:
# "% Introns <= {Intron_Artifact_Threshold}bp (potential artifacts)": introns this long or shorter
# "% Introns <= {Intron_Floor_Threshold}bp (floor)": introns this long or shorter (includes the previous ones)
# Default if omitted: 30 and 50.
Intron_Artifact_Threshold: 30
Intron_Floor_Threshold: 50
Threads: 1
